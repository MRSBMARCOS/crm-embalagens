.items-center{align-items:center}
.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.justify-end{justify-content:flex-end}
.gap-1{gap:4px}
.gap-2{gap:8px}
.gap-3{gap:12px}
.gap-4{gap:16px}

.relative{position:relative}
.absolute{position:absolute}
.fixed{position:fixed}
.sticky{position:sticky}
.inset-0{top:0;right:0;bottom:0;left:0}
.top-0{top:0}
.top-1\/2{top:50%}

.p-1{padding:4px}
.p-2{padding:8px}
.p-3{padding:12px}
.p-4{padding:16px}
.p-5{padding:20px}
.p-6{padding:24px}

.px-2{padding-left:8px;padding-right:8px}
.px-3{padding-left:12px;padding-right:12px}
.px-4{padding-left:16px;padding-right:16px}
.px-5{padding-left:20px;padding-right:20px}
.py-1{padding-top:4px;padding-bottom:4px}
.py-1\.5{padding-top:6px;padding-bottom:6px}
.py-2{padding-top:8px;padding-bottom:8px}
.py-3{padding-top:12px;padding-bottom:12px}

.pt-3{padding-top:12px}
.pb-3{padding-bottom:12px}
.mb-1{margin-bottom:4px}
.mb-2{margin-bottom:8px}
.mb-3{margin-bottom:12px}
.mb-4{margin-bottom:16px}
.mb-6{margin-bottom:24px}
.mt-0\.5{margin-top:2px}
.mt-1{margin-top:4px}
.mt-2{margin-top:8px}
.mt-3{margin-top:12px}
.mt-4{margin-top:16px}
.mt-6{margin-top:24px}
.mx-auto{margin-left:auto;margin-right:auto}

.text-xl{font-size:1.25rem;line-height:1.75rem}
.text-lg{font-size:1.125rem;line-height:1.75rem}
.text-base{font-size:1rem;line-height:1.5rem}

.text-left{text-align:left}
.text-right{text-align:right}
.font-bold{font-weight:700}

.italic{font-style:italic}
.uppercase{text-transform:uppercase}

.whitespace-nowrap{white-space:nowrap}

.overflow-y-auto{overflow-y:auto}
.outline-none{outline:none}
.resize-none{resize:none}
.cursor-pointer{cursor:pointer}
.transition{transition-property:background-color,border-color,color,fill,stroke,opacity,box-shadow,transform;transition-duration:150ms}
button{font:inherit;cursor:pointer;transition:filter 120ms ease, transform 120ms ease, box-shadow 120ms ease;}

input,select,textarea{font:inherit}
table{border-collapse:collapse}
@keyframes spin{to{transform:rotate(360deg)}}
